[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-atlas"
version = "0.1.0"
description = "Three-layer maritime intelligence atlas: AIS density, trade flows, live vessel positions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Maritime Atlas contributors"}]
keywords = ["maritime", "AIS", "shipping", "GeoJSON", "MapLibre", "OSINT"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=14,<17", "python-dotenv>=1,<2"]

[project.optional-dependencies]
routing = ["searoute>=1.2,<2"]
raster = ["rasterio>=1.3,<2", "numpy>=1.26,<3", "pillow>=10,<13"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
notebook = ["requests>=2.31,<3", "pandas>=2.1,<4", "ipython>=8,<10"]

[project.scripts]
maritime-atlas = "maritime_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
